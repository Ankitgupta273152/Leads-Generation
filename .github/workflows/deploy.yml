name: Build & Deploy

on:
  push:
    branches: [main]

env:
  DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -t $DOCKER_USER/leads-api:${{ github.sha }} -t $DOCKER_USER/leads-api:latest ./backend
          docker push $DOCKER_USER/leads-api:${{ github.sha }}
          docker push $DOCKER_USER/leads-api:latest

      - name: Build & Push Frontend
        run: |
          docker build --build-arg REACT_APP_API_URL=${{ secrets.API_URL }} \
            -t $DOCKER_USER/leads-ui:${{ github.sha }} -t $DOCKER_USER/leads-ui:latest ./frontend
          docker push $DOCKER_USER/leads-ui:${{ github.sha }}
          docker push $DOCKER_USER/leads-ui:latest

      
