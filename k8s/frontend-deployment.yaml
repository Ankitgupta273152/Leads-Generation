apiVersion: apps/v1
kind: Deployment
metadata:
  name: leads-ui
  namespace: leads-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leads-ui
  template:
    metadata:
      labels:
        app: leads-ui
    spec:
      containers:
      - name: leads-ui
        image: YOUR_DOCKERHUB_USERNAME/leads-ui:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: leads-ui-svc
  namespace: leads-app
spec:
  type: LoadBalancer
  selector:
    app: leads-ui
  ports:
  - port: 80
    targetPort: 80
