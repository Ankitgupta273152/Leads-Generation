apiVersion: apps/v1
kind: Deployment
metadata:
  name: leads-api
  namespace: leads-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leads-api
  template:
    metadata:
      labels:
        app: leads-api
    spec:
      containers:
      - name: leads-api
        image:ankg2005/leads-api:latest
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: leads-secrets
        env:
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: leads-api-svc
  namespace: leads-app
spec:
  selector:
    app: leads-api
  ports:
  - port: 5000
    targetPort: 5000
